<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Liên kết yêu thích</title>
</head>
<body>

    <h1>Liên kết yêu thích của tôi</h1>

    <ul>
        <!-- 1. Liên kết mở trong tab mới (target="_blank") -->
        <li>
            <a href="https://www.google.com" target="_blank">Trang tìm kiếm Google (Mở tab mới)</a>
        </li>

        <!-- 2. Các liên kết trang web khác -->
        <li>
            <a href="https://github.com">Nền tảng lưu trữ mã nguồn GitHub</a>
        </li>
        <li>
            <a href="https://www.youtube.com">Kênh giải trí YouTube</a>
        </li>

        <!-- 3. Liên kết đến file trong cùng thư mục (Internal link) -->
        <li>
            <a href="about.html">Xem trang Giới thiệu (about.html)</a>
        </li>

        <!-- 4. Liên kết đến Email (mailto:) -->
        <li>
            <a href="mailto:example@gmail.com">Gửi email cho tôi</a>
        </li>
    </ul>

</body>
</html>
